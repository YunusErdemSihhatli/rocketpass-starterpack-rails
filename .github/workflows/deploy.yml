name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ secrets.KAMAL_REGISTRY_PASSWORD != '' && secrets.KAMAL_SSH_PRIVATE_KEY != '' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bundle exec kamal deploy

      - name: Health check
        if: success()
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
        run: |
          if [ -n "$APP_HOST" ]; then
            echo "Checking health at $APP_HOST/up"
            for i in 1 2 3 4 5; do
              if curl -sf "$APP_HOST/up" > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            done
            echo "Health check failed after 5 attempts"
            exit 1
          else
            echo "APP_HOST not set, skipping health check"
          fi
