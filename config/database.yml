default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL", ENV.fetch("RAILS_MAX_THREADS", 5)) %>
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

development:
  <<: *default
  url: <%= ENV["DEVELOPMENT_DATABASE_URL"].presence || ENV["DATABASE_URL"].presence %>
  database: <%= ENV.fetch("DEVELOPMENT_DB_NAME", "rocketpass_starterpack_rails_development") %>

test:
  <<: *default
  url: <%= ENV["TEST_DATABASE_URL"].presence %>
  database: <%= ENV.fetch("TEST_DB_NAME", "rocketpass_starterpack_rails_test") %>

staging:
  <<: *default
  url: <%= ENV["STAGING_DATABASE_URL"].presence || ENV["DATABASE_URL"].presence %>
  database: <%= ENV.fetch("STAGING_DB_NAME", "rocketpass_starterpack_rails_staging") %>

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["PRODUCTION_DATABASE_URL"].presence || ENV["DATABASE_URL"].presence %>
    database: <%= ENV.fetch("PRODUCTION_DB_NAME", "rocketpass_starterpack_rails_production") %>
  cable:
    <<: *primary_production
    url: <%= ENV["PRODUCTION_CABLE_DATABASE_URL"].presence || ENV["CABLE_DATABASE_URL"].presence || ENV["PRODUCTION_DATABASE_URL"].presence || ENV["DATABASE_URL"].presence %>
    database: <%= ENV.fetch("PRODUCTION_CABLE_DB_NAME", "rocketpass_starterpack_rails_production_cable") %>
    migrations_paths: db/cable_migrate
